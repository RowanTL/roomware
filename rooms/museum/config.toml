# This website can help select a good color
# https://htmlcolorcodes.com/
#
# A # may be prepended to any of the color values.

[player]
# background.image = "./background.jpg"
background.color = "BF9560" # Does nothing if image is set
clock.color = "1A1A1A"
clock.remaining.color = "1A1A1A"
hint.remaining.color = "1A1A1A"
hint.amount.color = "1A1A1A"
hint.color = "1A1A1A"
win.color = "89D154"
win.text = "You win!"
lose.color = "E32D2D"
lose.text = "You lose!"
video = "./video.mp4"

[master]
background = "333333"
noise = "./audio.ogg" # Sound to play when pinging
time = 3600 # Must be a positive number in seconds

[frame]
border = "D3D3D3"
label = "D3D3D3"

[expander]
color = "D3D3D3"
hovered.color = "FFFFFF"

[button]
color = "1A1A1A"
background.color = "D3D3D3"
label.color = "1A1A1A"

[entry]
background.color = "D3D3D3"
text.color = "1A1A1A"

[hints]
default.amount = 5
