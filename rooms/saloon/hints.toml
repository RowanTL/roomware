hint_1 = "Find all of the snakes in both rooms. Match the snakes to their scales."

[No_code_wall]
box_name = "Box on Wall"
box_contents = "Silver Container w/ 1 Battery"
hint_1 = "Use the two rods to retrieve the container that is stuck in the first room."

[JAIL]
box_name = "Small Pretty Box"
box_contents = "1 Battery, Half of Jessies Letter"
hint_1 = "Layer the four clear coasters on top of each other and line up the letters. Read/solve the riddle to get the code."
hint_2 = "Be sure the letters are not upside down or backwards while layering the four clear coasters."
hint_3 = "The coasters say \"I'm a place where outlaws are locked away. Behind iron bars, they can't run or stray. What am I?\""
hint_4 = "The answer is another word for prison. \n_ _ _ _"

[RLAL]
box_name = "Left Side of Bar"
box_contents = "Gold Bars, Boot Key"
hint_1 = "There is a secret drawer in the right side of the bar you have unlocked."
hint_2 = "There is a secret drawer in the right side of the bar you have unlocked. Jessie's letter is telling you his favorite alcohol bottles."
hint_3 = "Put the batteries in the blacklight. Check out the alcohol bottle labels."
