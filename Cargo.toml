# https://semver.org/

[package]
name = "roomware"
version = "1.1.1"
edition = "2024"

[dependencies]
clap = "4.6.7"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_22"] }
relm4 = "0.11.0"
relm4-components = "0.11.0"
toml = { version = "1.1.6", features = ["preserve_order"] }

[build-dependencies]
embed-resource = "3.0.11"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
